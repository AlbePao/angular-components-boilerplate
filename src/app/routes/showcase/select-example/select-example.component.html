<h1>Select</h1>

<h2>Reactive forms</h2>
<form [formGroup]="form" class="mb-10">
  <app-form-field>
    <app-label>Native Select Control Example</app-label>
    <select appSelect formControlName="selectControlExample">
      <option selected></option>
      <option value="1">One</option>
      <option value="2">Two</option>
      <option value="3">Three</option>
    </select>
    @if (form.controls.selectControlExample | showControlError: 'required') {
      <app-error>{{ 'forms.controls.errors.required' | translate }}</app-error>
    }
  </app-form-field>
</form>

<h2>Template driven</h2>

<app-form-field>
  <app-form-field>
    <app-label>Native Select Example</app-label>
    <select appSelect (change)="logSelectChange('Native select', $event)">
      <option selected></option>
      <option value="1" selected>One</option>
      <option value="2">Two</option>
      <option value="3">Three</option>
    </select>
  </app-form-field>
</app-form-field>
